name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://diary:diary@localhost:5432/diary
      BETTER_AUTH_SECRET: ci-only-secret-that-is-long-enough-do-not-use
      BETTER_AUTH_URL: http://localhost:3000
      GOOGLE_CLIENT_ID: ci-placeholder
      GOOGLE_CLIENT_SECRET: ci-placeholder
      RESEND_API_KEY: ci-placeholder
      EMAIL_FROM: Diary <diary@example.com>

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm db:verify
      - run: pnpm audit:isolation
      - run: pnpm audit:behavioral
      - run: pnpm check:contrast
      - run: pnpm build
      - run: pnpm check:budgets
